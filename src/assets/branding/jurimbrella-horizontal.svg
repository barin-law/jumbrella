<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="264" height="60" fill="none">
  <defs>
    
    <linearGradient id="horiz_l_ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078CE" />
      <stop offset="25%" stop-color="#A8E063" />
      <stop offset="50%" stop-color="#2EAF4A" />
      <stop offset="75%" stop-color="#E8B949" />
      <stop offset="100%" stop-color="#002D5B" />
    </linearGradient>

    <linearGradient id="horiz_l_goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="50%" stop-color="#E8B949" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="horiz_l_blueRibGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#002D5B" />
      <stop offset="50%" stop-color="#005A9C" />
      <stop offset="100%" stop-color="#0078CE" />
    </linearGradient>

    <linearGradient id="horiz_l_greenLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E7B34" />
      <stop offset="40%" stop-color="#2EAF4A" />
      <stop offset="100%" stop-color="#A8E063" />
    </linearGradient>

    <linearGradient id="horiz_l_leafLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B6C2E" />
      <stop offset="50%" stop-color="#2EAF4A" />
      <stop offset="100%" stop-color="#9DE554" />
    </linearGradient>

    <linearGradient id="horiz_l_sunburstGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF066" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#A8E063" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2EAF4A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="horiz_l_anchorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078CE" />
      <stop offset="50%" stop-color="#002D5B" />
      <stop offset="100%" stop-color="#0078CE" />
    </linearGradient>

    <radialGradient id="horiz_l_discGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF3F9" />
    </radialGradient>

    <linearGradient id="horiz_l_penNibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D7A" />
      <stop offset="50%" stop-color="#002D5B" />
      <stop offset="100%" stop-color="#001833" />
    </linearGradient>

    <filter id="horiz_l_emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#002D5B" flood-opacity="0.15" />
    </filter>

    <filter id="horiz_l_sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
  </defs>

  <!-- Small Emblem on Left (ends at x = 90) -->
  <g transform="translate(10, 10) scale(0.15625)">
    
  <!-- Outer Concentric Shield Rings -->
  <g filter="url(#horiz_l_emblemShadow)">
    <!-- Outermost Multi-Tone Ring -->
    <circle cx="256" cy="256" r="246" fill="none" stroke="url(#horiz_l_ringGrad)" stroke-width="8" />
    
    <!-- Thin Golden Accent Inset Ring -->
    <circle cx="256" cy="256" r="240" fill="none" stroke="url(#horiz_l_goldAccent)" stroke-width="2.5" />
    
    <!-- Inner Deep Blue Framing Ring -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="#002D5B" stroke-width="5" />
    
    <!-- Main Circular Disc Canvas -->
    <circle cx="256" cy="256" r="232" fill="url(#horiz_l_discGrad)" />
    
    <!-- Inner Soft Radial Ring -->
    <circle cx="256" cy="256" r="232" fill="none" stroke="rgba(0,45,91,0.06)" stroke-width="1.5" />
  </g>

  <!-- Radiant Golden Sunburst Center -->
  <circle cx="256" cy="180" r="70" fill="url(#horiz_l_sunburstGrad)" filter="url(#horiz_l_sunGlow)" />

  <!-- The Open Sunburst Umbrella Canopy -->
  <g>
    <!-- Segment 1: Far Left Arch -->
    <path d="M 64,250 C 72,175 125,108 200,75 L 256,180 L 138,230 Z" fill="url(#horiz_l_blueRibGrad)" opacity="0.95" />
    
    <!-- Segment 2: Mid-Left Outer -->
    <path d="M 132,232 L 256,180 L 195,78 C 172,92 145,116 122,148 Z" fill="url(#horiz_l_greenLeafGrad)" />
    
    <!-- Segment 3: Mid-Left Inner -->
    <path d="M 195,78 L 256,180 L 228,68 C 216,72 205,76 195,78 Z" fill="url(#horiz_l_blueRibGrad)" />

    <!-- Segment 4: Left-Center -->
    <path d="M 228,68 L 256,180 L 256,64 Z" fill="url(#horiz_l_greenLeafGrad)" />

    <!-- Segment 5: Right-Center -->
    <path d="M 256,64 L 256,180 L 284,68 Z" fill="url(#horiz_l_blueRibGrad)" />

    <!-- Segment 6: Mid-Right Inner -->
    <path d="M 284,68 L 256,180 L 317,78 C 306,75 295,71 284,68 Z" fill="url(#horiz_l_greenLeafGrad)" />

    <!-- Segment 7: Mid-Right Outer -->
    <path d="M 317,78 L 256,180 L 380,232 C 390,195 365,130 317,78 Z" fill="url(#horiz_l_blueRibGrad)" />

    <!-- Segment 8: Far Right Arch -->
    <path d="M 374,230 L 256,180 L 448,250 C 440,175 387,108 312,75 Z" fill="url(#horiz_l_greenLeafGrad)" opacity="0.95" />

    <!-- Glossy Arc Highlights over Umbrella Canopy -->
    <path d="M 68,248 C 110,130 180,72 256,66 C 332,72 402,130 444,248 C 392,204 330,176 256,176 C 182,176 120,204 68,248 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45" />

    <!-- Center Finial Knob (Apex of the Pen/Umbrella) -->
    <circle cx="256" cy="180" r="14" fill="#002D5B" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="256" cy="180" r="6" fill="#A8E063" />
  </g>

  <!-- The Fountain Pen Nib -->
  <g>
    <!-- Upper Neck / Shaft of Pen Nib -->
    <path d="M 247,192 L 265,192 L 268,228 L 244,228 Z" fill="url(#horiz_l_penNibGrad)" />

    <!-- Pen Nib Head Silhouette -->
    <path d="M 244,228 L 222,254 C 220,272 232,306 256,356 C 280,306 292,272 290,254 L 268,228 Z" 
          fill="url(#horiz_l_penNibGrad)" stroke="#002D5B" stroke-width="2" stroke-linejoin="round" />

    <!-- Pen Nib Slit & Center Breather Hole -->
    <circle cx="256" cy="274" r="5" fill="#FFFFFF" />
    <line x1="256" y1="279" x2="256" y2="354" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nib Shoulder Engraving Arches -->
    <path d="M 234,260 Q 256,278 278,260" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.7" />
  </g>

  <!-- Two Vibrant Green Leaves Flanking Nib -->
  <g>
    <!-- Left Leaf -->
    <path d="M 244,342 C 205,338 168,298 178,258 C 218,252 242,298 244,342 Z" 
          fill="url(#horiz_l_leafLeftGrad)" stroke="#1B6C2E" stroke-width="1.5" />
    <!-- Left Leaf Center Vein -->
    <path d="M 244,342 Q 212,302 188,268" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.65" stroke-linecap="round" />

    <!-- Right Leaf -->
    <path d="M 268,342 C 307,338 344,298 334,258 C 294,252 270,298 268,342 Z" 
          fill="url(#horiz_l_greenLeafGrad)" stroke="#1B6C2E" stroke-width="1.5" />
    <!-- Right Leaf Center Vein -->
    <path d="M 268,342 Q 300,302 324,268" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.65" stroke-linecap="round" />
  </g>

  <!-- Anchor Cradle & Flukes -->
  <g>
    <!-- Main Sweeping Anchor Crescent Beam -->
    <path d="M 152,306 C 180,366 220,388 256,388 C 292,388 332,366 360,306 C 330,344 290,364 256,364 C 222,364 182,344 152,306 Z" 
          fill="url(#horiz_l_anchorGrad)" stroke="#002D5B" stroke-width="1.5" />

    <!-- Left Fluke Arrowhead -->
    <path d="M 152,306 L 164,320 L 140,326 Z" fill="#002D5B" />
    <!-- Right Fluke Arrowhead -->
    <path d="M 360,306 L 348,320 L 372,326 Z" fill="#002D5B" />
  </g>
  
  </g>

  <!-- Wordmark (x starts at 112) -->
  <text x="112" y="48" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#002D5B">Juri</tspan><tspan fill="#2EAF4A">Mbrella</tspan>
  </text>

  <!-- Tagline below wordmark (clean, non-overlapping) -->
  <line x1="112" y1="71" x2="128" y2="71" stroke="#2EAF4A" stroke-width="2" stroke-linecap="round" />
  <text x="135" y="75" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.2" fill="#475569">
    Protection over every signature
  </text>
  <line x1="344" y1="71" x2="360" y2="71" stroke="#2EAF4A" stroke-width="2" stroke-linecap="round" />
</svg>