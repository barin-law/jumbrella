name: Deploy JuriMbrella to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build JuriMbrella
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify production build
        run: |
          echo "Checking dist directory..."
          test -d dist

          echo "Checking index.html..."
          test -f dist/index.html

          echo "Checking 404.html..."
          test -f dist/404.html

          echo "Checking .nojekyll..."
          test -f dist/.nojekyll

          echo ""
          echo "Production files:"
          ls -lah dist

          echo ""
          echo "Generated asset references:"
          grep -oE '(src|href)="[^"]+"' dist/index.html || true

          echo ""
          echo "Checking for incorrect /barinlaw/ references..."

          if grep -RIn "/barinlaw/" dist --exclude="*.map"; then
            echo "ERROR: Found old /barinlaw/ references."
            exit 1
          fi

          echo "No old /barinlaw/ references found."

          echo ""
          echo "Checking for /jumbrella/ references..."
          grep -oE '/jumbrella/[^"]+' dist/index.html || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy JuriMbrella
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
